<!DOCTYPE html>
<html lang="en-AU" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Value Command Centre</title>
<style>
/* ============================================================
   AGENT VALUE COMMAND CENTRE — V2 (guided AI Value Realisation Platform)
   Journey-first. Self-contained. Synthetic demo data — indicative only.
   ============================================================ */
:root{
  --bg-0:#07111F; --bg-1:#0B1220; --bg-2:#101827;
  --glass:rgba(255,255,255,0.06); --glass-2:rgba(255,255,255,0.09);
  --glass-brd:rgba(255,255,255,0.10); --glass-brd-strong:rgba(255,255,255,0.18);
  --ink:#F4F7FB; --ink-soft:#C4CEDC; --ink-mute:#8493A8;
  --cyan:#38E1FF; --azure:#4C8DFF; --violet:#8B7BFF; --indigo:#5B6BFF;
  --emerald:#34E5A6; --amber:#FFC24B; --rose:#FF6B85;
  --shadow:0 18px 50px -18px rgba(0,0,0,0.75);
  --radius:22px; --radius-sm:14px;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="light"]{
  --bg-0:#EEF2F8; --bg-1:#E7ECF5; --bg-2:#DDE5F0;
  --glass:rgba(255,255,255,0.74); --glass-2:rgba(255,255,255,0.9);
  --glass-brd:rgba(12,22,40,0.10); --glass-brd-strong:rgba(12,22,40,0.18);
  --ink:#0C1626; --ink-soft:#2C3A4F; --ink-mute:#5C6B80;
  --shadow:0 18px 44px -20px rgba(20,40,80,0.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--font);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:.1px;
  background:
    radial-gradient(1100px 720px at 82% -10%, rgba(76,141,255,0.20), transparent 60%),
    radial-gradient(920px 640px at -8% 10%, rgba(139,123,255,0.18), transparent 55%),
    radial-gradient(820px 720px at 60% 112%, rgba(56,225,255,0.10), transparent 55%),
    linear-gradient(160deg,var(--bg-0),var(--bg-1) 45%,var(--bg-2));
  background-attachment:fixed;}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:20px}::-webkit-scrollbar-track{background:transparent}
a{color:var(--cyan);text-decoration:none}
button{font:inherit}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:22px 14px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-right:1px solid var(--glass-brd);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 18px}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(140deg,var(--cyan),var(--indigo));display:grid;place-items:center;color:#04121f;font-weight:800;font-size:18px;box-shadow:0 8px 22px -6px rgba(56,225,255,.55)}
.brand h1{font-size:13.5px;margin:0;line-height:1.15;font-weight:700}.brand span{font-size:10.5px;color:var(--ink-mute)}
.rail nav{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.rail nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 13px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--ink-soft);font-size:13.5px;cursor:pointer;transition:.16s}
.rail nav button .ic{width:18px;text-align:center;font-size:15px;opacity:.9}
.rail nav button:hover{background:var(--glass-2);color:var(--ink)}
.rail nav button.on{background:linear-gradient(100deg,rgba(56,225,255,.16),rgba(91,107,255,.14));border-color:var(--glass-brd-strong);color:var(--ink)}
.rail .next{margin-top:auto;background:var(--glass-2);border:1px solid var(--glass-brd);border-radius:14px;padding:13px;font-size:11.5px}
.rail .next small{color:var(--cyan);letter-spacing:.6px;text-transform:uppercase;font-size:9.5px;font-weight:700}
.rail .next b{display:block;margin:5px 0 8px;font-size:12.5px;line-height:1.35}
.rail .next button{width:100%;justify-content:center;background:linear-gradient(120deg,var(--cyan),var(--azure));color:#05121f;border:none;font-weight:700;border-radius:10px;padding:8px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;gap:14px;align-items:center;padding:13px 26px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-brd)}
.topbar .org{display:flex;flex-direction:column}.topbar .org b{font-size:13.5px}.topbar .org small{font-size:10.5px;color:var(--ink-mute)}
.topbar .grow{flex:1}
.topbar .nextchip{display:flex;align-items:center;gap:9px;background:var(--glass-2);border:1px solid var(--glass-brd-strong);border-radius:30px;padding:6px 8px 6px 14px;font-size:12px}
.topbar .nextchip b{color:var(--cyan)}
.topbar .nextchip button{background:linear-gradient(120deg,var(--cyan),var(--azure));color:#05121f;border:none;font-weight:700;border-radius:20px;padding:6px 13px;cursor:pointer;font-size:11.5px}
.view{padding:26px 30px 70px;max-width:1320px;width:100%;margin:0 auto;animation:rise .45s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* ---------- Buttons / chips ---------- */
.btn{background:var(--glass-2);color:var(--ink);border:1px solid var(--glass-brd-strong);border-radius:12px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:.16s}
.btn:hover{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,225,255,.12)}
.btn.primary{background:linear-gradient(120deg,var(--cyan),var(--azure));color:#05121f;border:none;font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.lg{padding:13px 22px;font-size:14px;border-radius:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid transparent}
.chip.emerald{background:rgba(52,229,166,.14);color:var(--emerald);border-color:rgba(52,229,166,.3)}
.chip.amber{background:rgba(255,194,75,.14);color:var(--amber);border-color:rgba(255,194,75,.3)}
.chip.rose{background:rgba(255,107,133,.14);color:var(--rose);border-color:rgba(255,107,133,.3)}
.chip.cyan{background:rgba(56,225,255,.14);color:var(--cyan);border-color:rgba(56,225,255,.3)}
.chip.violet{background:rgba(139,123,255,.16);color:var(--violet);border-color:rgba(139,123,255,.32)}
.chip.grey{background:var(--glass-2);color:var(--ink-soft);border-color:var(--glass-brd)}

/* ---------- Cards / glass ---------- */
.card{background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--radius);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow)}
.pad{padding:20px}.grid{display:grid;gap:16px}
.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--cyan);font-weight:700}
.h1{font-size:24px;font-weight:760;margin:6px 0 0}.h2{font-size:16.5px;font-weight:700;margin:0}
.muted{color:var(--ink-mute)}.soft{color:var(--ink-soft)}.tiny{font-size:11px;color:var(--ink-mute)}
.section-h{display:flex;align-items:baseline;gap:12px;margin:28px 0 14px}.section-h .note{font-size:11.5px;color:var(--ink-mute)}
.callout{border-left:3px solid var(--cyan);background:var(--glass-2);border-radius:0 12px 12px 0;padding:13px 15px;font-size:12.5px;line-height:1.6}
.callout.amber{border-color:var(--amber)}.callout.violet{border-color:var(--violet)}.callout.emerald{border-color:var(--emerald)}
.hint{font-size:11.5px;color:var(--ink-mute);margin-top:6px;display:flex;gap:6px;align-items:center}
.hint:before{content:"ⓘ";color:var(--cyan);font-size:12px}

/* ---------- Welcome ---------- */
.welcome{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px;text-align:center;animation:rise .5s ease}
.welcome .logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(140deg,var(--cyan),var(--indigo));display:grid;place-items:center;color:#04121f;font-weight:800;font-size:30px;box-shadow:0 14px 40px -8px rgba(56,225,255,.6);margin-bottom:22px}
.welcome h1{font-size:40px;font-weight:800;margin:0;line-height:1.05;background:linear-gradient(120deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.welcome .verbs{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:18px 0 4px}
.welcome .verbs span{font-size:15px;color:var(--ink-soft);font-weight:600}.welcome .verbs span b{color:var(--cyan)}
.welcome p.lead{max-width:560px;color:var(--ink-soft);font-size:15px;line-height:1.6;margin:14px auto 4px}
.welcome .q{font-size:13px;color:var(--ink-mute);margin:26px 0 16px;letter-spacing:.3px}
.action-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;max-width:1040px;width:100%}
.action-card{background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;padding:22px 16px;cursor:pointer;transition:.2s;text-align:center;backdrop-filter:blur(16px)}
.action-card:hover{transform:translateY(-6px);border-color:var(--glass-brd-strong);box-shadow:var(--shadow)}
.action-card .ic{font-size:26px;display:block;margin-bottom:12px}
.action-card b{font-size:13.5px;display:block}.action-card small{font-size:11px;color:var(--ink-mute);display:block;margin-top:6px;line-height:1.4}
.welcome .foot{margin-top:30px;font-size:11px;color:var(--ink-mute)}

/* ---------- Wizard ---------- */
.wizard{max-width:720px;margin:0 auto;padding:40px 24px 70px;animation:rise .4s ease}
.wizard-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.stepbar{display:flex;gap:6px;margin:16px 0 26px}
.stepbar i{height:5px;border-radius:6px;flex:1;background:rgba(255,255,255,.10);overflow:hidden;position:relative}
.stepbar i.done{background:linear-gradient(90deg,var(--cyan),var(--azure))}
.stepbar i.now{background:linear-gradient(90deg,var(--cyan),var(--azure));opacity:.55}
.wizard .stepno{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--cyan);font-weight:700}
.wizard .qh{font-size:26px;font-weight:750;margin:8px 0 4px;line-height:1.2}
.wizard .qsub{color:var(--ink-mute);font-size:13.5px;margin-bottom:22px}
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:7px;font-weight:600}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;background:var(--glass-2);border:1px solid var(--glass-brd-strong);border-radius:12px;padding:12px 14px;color:var(--ink);font:inherit;font-size:14px;outline:none;transition:.16s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,225,255,.14)}
.field textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--glass-2);border:1px solid var(--glass-brd-strong);border-radius:15px;padding:18px 16px;cursor:pointer;transition:.16s;text-align:left}
.tile:hover{border-color:var(--cyan);transform:translateY(-3px)}
.tile.sel{border-color:var(--cyan);background:linear-gradient(120deg,rgba(56,225,255,.16),rgba(91,107,255,.12));box-shadow:0 0 0 1px rgba(56,225,255,.3)}
.tile .ic{font-size:22px;display:block;margin-bottom:8px}.tile b{font-size:13.5px}.tile small{display:block;font-size:11px;color:var(--ink-mute);margin-top:4px}
.checks{display:flex;flex-wrap:wrap;gap:9px}
.check{padding:9px 14px;border-radius:22px;background:var(--glass-2);border:1px solid var(--glass-brd-strong);cursor:pointer;font-size:12.5px;transition:.15s;user-select:none}
.check:hover{border-color:var(--cyan)}.check.sel{background:linear-gradient(120deg,rgba(56,225,255,.18),rgba(91,107,255,.14));border-color:var(--cyan);color:#fff}
.slabel{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}.slabel b{color:var(--cyan);font-size:15px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:20px;background:rgba(255,255,255,.12);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:linear-gradient(140deg,var(--cyan),var(--azure));cursor:pointer;box-shadow:0 0 0 5px rgba(56,225,255,.18)}
.mat-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-mute);margin-top:8px}
.wizard-nav{display:flex;justify-content:space-between;margin-top:30px;gap:12px}

/* loader */
.loader{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;animation:rise .4s}
.loader .spin{width:96px;height:96px}
.loader .status{font-size:15px;color:var(--ink-soft);min-height:22px;transition:.3s}
.loader h3{font-size:20px;margin:0}

/* insight cards */
.insight-list{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.insight-item{display:flex;gap:12px;align-items:center;padding:13px 16px;background:var(--glass-2);border:1px solid var(--glass-brd);border-radius:14px;animation:rise .4s both}
.insight-item .tick{width:26px;height:26px;border-radius:50%;background:rgba(52,229,166,.16);color:var(--emerald);display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.baseline-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:8px}
.bcard{background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;padding:20px;animation:pop .4s both}
.bcard small{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-mute)}
.bcard .bv{font-size:26px;font-weight:770;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.bcard .bd{font-size:11.5px;color:var(--ink-soft);line-height:1.4}

/* ---------- Home ---------- */
.estate{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-bottom:6px}
.estate .now-banner{background:linear-gradient(120deg,rgba(56,225,255,.14),rgba(91,107,255,.12));border:1px solid var(--glass-brd-strong)}
.estate-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.estate-stats .s{padding:12px;border-radius:14px;background:var(--glass-2);border:1px solid var(--glass-brd)}
.estate-stats .s small{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-mute)}
.estate-stats .s b{display:block;font-size:20px;margin-top:5px;font-variant-numeric:tabular-nums}
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.qa{background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;padding:20px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.qa:hover{transform:translateY(-5px);border-color:var(--glass-brd-strong);box-shadow:var(--shadow)}
.qa .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:20px;margin-bottom:14px;background:linear-gradient(140deg,rgba(56,225,255,.2),rgba(91,107,255,.16));border:1px solid var(--glass-brd)}
.qa b{font-size:15px}.qa p{font-size:12px;color:var(--ink-mute);margin:6px 0 0;line-height:1.45}
.qa .go{position:absolute;top:20px;right:20px;color:var(--ink-mute);transition:.2s}.qa:hover .go{color:var(--cyan);transform:translateX(3px)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{position:relative;overflow:hidden;padding:18px;border-radius:18px;background:var(--glass);border:1px solid var(--glass-brd);box-shadow:var(--shadow);cursor:pointer;transition:.2s}
.kpi:hover{transform:translateY(-4px);border-color:var(--glass-brd-strong)}
.kpi .cap{font-size:11px;color:var(--ink-mute);display:flex;align-items:center;gap:8px}.kpi .dot{width:8px;height:8px;border-radius:50%}
.kpi .val{font-size:27px;font-weight:770;margin:8px 0 2px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .intp{font-size:11px;color:var(--ink-soft);line-height:1.4;margin-top:5px}

/* agent cards */
.agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.agent-card{background:var(--glass);border:1px solid var(--glass-brd);border-radius:18px;padding:18px;cursor:pointer;transition:.2s}
.agent-card:hover{transform:translateY(-5px);border-color:var(--glass-brd-strong);box-shadow:var(--shadow)}
.agent-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.agent-card h4{margin:0;font-size:14.5px;line-height:1.25}.agent-card .pr-sub{font-size:11px;color:var(--ink-mute);margin-top:3px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 12px}
.scores .sc{text-align:center;padding:10px 6px;border-radius:12px;background:var(--glass-2);border:1px solid var(--glass-brd)}
.scores .sc small{font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-mute);display:block}
.scores .sc b{font-size:17px;font-variant-numeric:tabular-nums}
.agent-card .val-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-soft);padding-top:10px;border-top:1px solid var(--glass-brd)}

/* empty state */
.empty{max-width:520px;margin:8vh auto;text-align:center;animation:rise .4s}
.empty .illus{margin:0 auto 22px}
.empty h2{font-size:22px;margin:0 0 8px}.empty p{color:var(--ink-soft);font-size:14px;line-height:1.6;margin:0 auto 8px;max-width:420px}
.empty .time{display:inline-flex;gap:7px;align-items:center;font-size:12px;color:var(--ink-mute);background:var(--glass-2);border:1px solid var(--glass-brd);padding:6px 13px;border-radius:20px;margin:14px 0 22px}

/* pillars / drivers / table */
.cols{display:grid;grid-template-columns:1.25fr .85fr;gap:16px}
.pbar{height:8px;border-radius:20px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 6px}.pbar i{display:block;height:100%;border-radius:20px}
.driver{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--glass-brd);cursor:pointer}
.driver:hover{background:var(--glass-2);border-radius:12px;padding-left:10px}
.driver .rank{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--glass-2);border:1px solid var(--glass-brd)}
.driver .nm{font-weight:600;font-size:13px}.driver .sub{font-size:11px;color:var(--ink-mute);margin-top:2px}.driver .rt{text-align:right}.driver .rt b{font-size:14px}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--glass-brd)}
th{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-mute);font-weight:600}
tbody tr:hover{background:var(--glass-2)}.num{text-align:right;font-variant-numeric:tabular-nums}
.mini-bar{height:6px;border-radius:6px;background:rgba(255,255,255,.09);overflow:hidden;min-width:54px}.mini-bar i{display:block;height:100%;border-radius:6px}

/* audience chips */
.aud{display:flex;gap:9px;flex-wrap:wrap;margin:6px 0 18px}
.aud .a{padding:9px 15px;border-radius:22px;background:var(--glass-2);border:1px solid var(--glass-brd-strong);cursor:pointer;font-size:12.5px;transition:.15s}
.aud .a:hover{border-color:var(--cyan)}.aud .a.on{background:linear-gradient(120deg,var(--cyan),var(--azure));color:#05121f;font-weight:700;border:none}

/* report */
.report-page{background:linear-gradient(160deg,#0a1424,#0b1220);border:1px solid var(--glass-brd);border-radius:18px;overflow:hidden}
[data-theme="light"] .report-page{background:linear-gradient(160deg,#fff,#eef2f8)}
.report-cover{padding:44px 40px;background:radial-gradient(700px 300px at 100% 0,rgba(56,225,255,.22),transparent 60%),linear-gradient(150deg,#0c1a30,#0a1220)}
[data-theme="light"] .report-cover{background:radial-gradient(700px 300px at 100% 0,rgba(56,225,255,.18),transparent 60%),linear-gradient(150deg,#eaf1fb,#dbe6f5)}
.report-cover .big{font-size:50px;font-weight:800;margin:12px 0 0;line-height:1;background:linear-gradient(120deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
[data-theme="light"] .report-cover .big{background:linear-gradient(120deg,#0c1626,var(--azure));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.report-sec{padding:24px 40px;border-bottom:1px solid var(--glass-brd)}.report-sec h3{font-size:14.5px;color:var(--cyan);margin:0 0 12px}

<body>
<div id="root"></div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
/* =====================================================================
   ENGINE + DEFAULTS
   ===================================================================== */
const DEFAULTS={workingHoursPerDay:7.6,annualHoursPerFTE:1748,realisation:0.40,conservatism:0.70};
const CONF_SCORE={High:90,Medium:65,Low:40};
const RISK_SCORE={Low:25,Medium:55,High:82};
const RISK_COLOR={Low:"var(--emerald)",Medium:"var(--amber)",High:"var(--rose)"};

function calcLever(l,o){
  const hoursSaved=l.txns*l.mins/60, realised=hoursSaved*o.realisation, conservative=realised*o.conservatism;
  return {...l,hoursSaved,realised,conservative,opsDays:conservative/o.workingHoursPerDay,fte:conservative/o.annualHoursPerFTE,
    rawFin:hoursSaved*l.rate,finalFin:hoursSaved*l.rate*o.realisation*o.conservatism};
}
function calcAgent(a,o){
  let hoursSaved=0,conservative=0,opsDays=0,fte=0,finalFin=0,rawFin=0;
  const levers=(a.levers||[]).map(l=>{const c=calcLever(l,o);hoursSaved+=c.hoursSaved;conservative+=c.conservative;opsDays+=c.opsDays;fte+=c.fte;finalFin+=c.finalFin;rawFin+=c.rawFin;return c;});
  return {...a,levers,hoursSaved,conservative,opsDays,fte,finalFin,rawFin};
}
function calcOrg(o){
  const org={...DEFAULTS,...o};
  const agents=(org.agents||[]).map(a=>calcAgent(a,org)).sort((x,y)=>y.finalFin-x.finalFin);
  const totals=agents.reduce((t,a)=>{t.hoursSaved+=a.hoursSaved;t.conservative+=a.conservative;t.opsDays+=a.opsDays;t.fte+=a.fte;t.finalFin+=a.finalFin;t.users+=a.users;return t;},{hoursSaved:0,conservative:0,opsDays:0,fte:0,finalFin:0,users:0});
  totals.agents=agents.length; totals.processes=new Set(agents.map(a=>a.process)).size;
  const pillars=(org.pillars||[]).map(name=>({name,interp:(org.pillarInterp||{})[name]||"",value:0,hours:0,agents:new Set(),topLever:null}));
  const pmap=Object.fromEntries(pillars.map(p=>[p.name,p]));
  const drivers=[];
  agents.forEach(a=>a.levers.forEach(l=>{const p=pmap[l.pillar];if(!p)return;p.value+=l.finalFin;p.hours+=l.conservative;p.agents.add(a.name);if(!p.topLever||l.finalFin>p.topLever.finalFin)p.topLever={name:l.driver,agent:a.name,finalFin:l.finalFin};drivers.push({...l,agent:a.name,agentId:a.id});}));
  pillars.forEach(p=>{p.agentCount=p.agents.size;p.pct=totals.finalFin?p.value/totals.finalFin*100:0;});
  pillars.sort((a,b)=>b.value-a.value); drivers.sort((a,b)=>b.finalFin-a.finalFin);
  let cw=0,w=0; drivers.forEach(d=>{cw+=CONF_SCORE[d.conf]*d.finalFin;w+=d.finalFin;});
  const dq=w?cw/w:60, confLabel=dq>=80?"High":dq>=58?"Medium":"Developing";
  const maxFin=Math.max(...agents.map(a=>a.finalFin),1);
  agents.forEach(a=>{a.valueScore=Math.round(a.finalFin/maxFin*100);a.readinessScore=a.readiness;a.riskScore=RISK_SCORE[a.risk];a.govScore=a.governance||Math.round((a.readiness+CONF_SCORE[a.conf])/2);a.quadrant=quadrant(a.valueScore,a.readiness);a.recommendation=recommend(a);});
  return {...org,agents,totals,pillars,drivers,dq,confLabel};
}
function quadrant(v,r){if(v>=50&&r>=55)return"Scale now";if(v>=50)return"Validate next";if(r>=55)return"Monitor";return"Rework or retire";}
function recommend(a){const q=a.quadrant;
  if(q==="Scale now")return{tag:"Scale",cls:"emerald",text:"Strong value with high readiness — prioritise for production scale and funding."};
  if(q==="Validate next")return{tag:"Validate",cls:"cyan",text:"High potential value but readiness needs lifting — validate assumptions and data before scaling."};
  if(q==="Monitor")return{tag:"Improve",cls:"amber",text:"Ready but modest value at current scope — increase adoption or broaden the use case."};
  return{tag:"Retire",cls:"rose",text:"Low value and low readiness — redesign the use case, improve data, or retire."};}

/* =====================================================================
   EXAMPLE DATASET — Contoso (synthetic, indicative only)
   ===================================================================== */
function lv(pillar,driver,baseName,baseVal,unit,change,mins,txns,users,rate,conf,atype,src,valreq){return{pillar,driver,baseName,baseVal,unit,change,mins,txns,users,rate,conf,atype,src,valreq};}
function ag(o){return Object.assign({type:"Assistive agent",platform:"Microsoft Copilot / Copilot Studio",lifecycle:"Piloting",usage:"Growing",risk:"Medium",readiness:60},o);}
const EXAMPLE={
  name:"Contoso Corporate Services (Demo)",industry:"Corporate / Enterprise",region:"Australia",currency:"AUD",period:"FY2025–26 (indicative)",
  employees:26000,budget:"—",aiMaturity:2,stance:"have",
  statement:"AI agents are lifting employee productivity, improving customer and employee experience, and strengthening compliance — creating capacity for higher-value work across shared services.",
  pillars:["Productivity & Process Efficiency","Customer Experience","Employee Experience","Compliance & Risk","Financial Optimisation"],
  pillarInterp:{"Productivity & Process Efficiency":"Time returned across service and back-office processes.","Customer Experience":"Faster, more consistent customer responses and resolution.","Employee Experience":"Reduced friction and faster answers for employees.","Compliance & Risk":"More consistent, auditable checks reducing exposure.","Financial Optimisation":"Reduced rework and avoidable cost across finance and procurement."},
  governance:[{name:"Data readiness",score:70},{name:"Ownership & accountability",score:74},{name:"Lifecycle management",score:60},{name:"Monitoring & evaluation",score:56},{name:"Security controls",score:80},{name:"Privacy & compliance",score:72},{name:"Responsible AI controls",score:68},{name:"Operational support",score:63},{name:"Adoption readiness",score:66},{name:"Value tracking maturity",score:50}],
  agents:[

      levers:[lv("Customer Experience","Response drafting time reduced","Avg handle time per contact",9,"minutes",-6,6,720000,480,55,"High","Customer-supplied","Contact-centre telemetry","Validate contacts/agent/day"),lv("Productivity & Process Efficiency","Case wrap-up automation","Avg after-call work",5,"minutes",-4,4,720000,480,55,"Medium","Benchmark","Benchmark","Validate ACW baseline")]}),
    ag({id:"hr",name:"HR Helpdesk Agent",owner:"People & Culture",dept:"Human Resources",fn:"Employee Services",process:"Employee HR query resolution",userGroup:"HR advisors & employees",users:3600,risk:"Low",readiness:70,conf:"Medium",usage:"Growing",desc:"Answers common HR and policy questions with cited sources, deflecting routine queries and freeing advisor time.",
      levers:[lv("Employee Experience","HR query resolution time reduced","Avg HR query handling time",15,"minutes",-8,8,156000,3600,60,"Medium","Benchmark","HR shared-services benchmark","Validate query volume")]}),
    ag({id:"proc",name:"Procurement Assistant",owner:"Procurement",dept:"Finance & Procurement",fn:"Procurement",process:"Purchase order and contract drafting",userGroup:"Procurement officers",users:240,risk:"Medium",readiness:60,conf:"Medium",usage:"Growing",desc:"Drafts POs and contract clauses and checks against policy, reducing cycle time and improving compliance.",
      levers:[lv("Productivity & Process Efficiency","PO & contract drafting reduced","Avg drafting time per document",50,"minutes",-18,18,42000,240,78,"Medium","Assumed","Officer estimate","Validate document volume"),lv("Compliance & Risk","Policy check consistency","Documents passing policy check first time",74,"%",6,6,42000,240,78,"Low","Assumed","Estimate","Validate exception baseline")]}),
    ag({id:"itsm",name:"IT Service Management Agent",owner:"Enterprise IT",dept:"Information Technology",fn:"IT Service Management",process:"IT ticket triage and resolution assist",userGroup:"Service-desk analysts",users:5200,risk:"Low",readiness:78,conf:"High",lifecycle:"Scaling",usage:"High",desc:"Triages tickets, suggests resolutions and drafts updates, improving first-contact resolution and deflection.",
      levers:[lv("Productivity & Process Efficiency","Ticket triage & resolution assist","Avg time per ticket",22,"minutes",-7,7,384000,5200,72,"High","Customer-supplied","ITSM telemetry","Validate tickets/analyst")]}),
    ag({id:"finance",name:"Finance Close Assistant",owner:"Financial Control",dept:"Finance & Procurement",fn:"Finance",process:"Reconciliation and month-end reporting",userGroup:"Finance analysts",users:180,risk:"Medium",readiness:56,conf:"Medium",usage:"Emerging",desc:"Assists with reconciliations, variance commentary and reporting, reducing close effort and improving timeliness.",
      levers:[lv("Financial Optimisation","Reconciliation & reporting reduced","Avg time per reconciliation task",55,"minutes",-20,20,36000,180,85,"Medium","Benchmark","Finance benchmark","Validate task volume")]}),
    ag({id:"legal",name:"Legal Contract Review Agent",owner:"Legal & Compliance",dept:"Legal",fn:"Legal",process:"First-pass contract review",userGroup:"In-house counsel",users:90,risk:"High",readiness:48,conf:"Low",lifecycle:"Exploring",usage:"Emerging",desc:"Performs first-pass review, clause extraction and risk flagging for counsel validation, accelerating review cycles.",
      levers:[lv("Compliance & Risk","First-pass review time reduced","Avg first-pass review time",90,"minutes",-35,35,18000,90,120,"Low","Assumed","Counsel estimate","Validate contract volume and risk mix")]}),
    ag({id:"sales",name:"Sales Proposal & RFP Assistant",owner:"Revenue Operations",dept:"Sales",fn:"Sales & Revenue",process:"Proposal and RFP response drafting",userGroup:"Sales & bid teams",users:320,risk:"Medium",readiness:62,conf:"Medium",usage:"Growing",desc:"Drafts proposals and structured RFP responses from a content library, accelerating turnaround and improving consistency.",
      levers:[lv("Productivity & Process Efficiency","Proposal & RFP drafting reduced","Avg drafting time per response",180,"minutes",-22,22,54000,320,82,"Medium","Benchmark","Bid-team benchmark","Validate response volume")]}),
    ag({id:"mktg",name:"Marketing Content Assistant",owner:"Brand & Marketing",dept:"Marketing",fn:"Marketing",process:"Campaign and content drafting",userGroup:"Content staff",users:240,risk:"Low",readiness:66,conf:"Medium",usage:"Growing",desc:"Drafts campaign copy and content assets for review, freeing creative time and improving throughput.",
      levers:[lv("Customer Experience","Content drafting time reduced","Avg drafting time per asset",40,"minutes",-15,15,72000,240,70,"Medium","Benchmark","Marketing benchmark","Validate asset volume")]}),
    ag({id:"onboard",name:"Employee Onboarding Assistant",owner:"People & Culture",dept:"Human Resources",fn:"Employee Services",process:"New-starter onboarding and documentation",userGroup:"HR & hiring managers",users:1400,risk:"Low",readiness:55,conf:"Low",lifecycle:"Exploring",usage:"Emerging",desc:"Guides new starters, answers questions and drafts onboarding paperwork, reducing coordination effort.",
      levers:[lv("Employee Experience","Onboarding coordination reduced","Avg onboarding admin per starter",90,"minutes",-10,10,96000,1400,58,"Low","Assumed","HR estimate","Validate hires/year")]}),
    ag({id:"insights",name:"Data & Reporting Insights Assistant",owner:"Enterprise Analytics",dept:"Finance & Procurement",fn:"Analytics",process:"Management reporting and variance commentary",userGroup:"Analysts & managers",users:600,risk:"Medium",readiness:52,conf:"Medium",usage:"Growing",desc:"Drafts management reports and variance commentary and answers self-serve data questions, speeding decisions.",
      levers:[lv("Financial Optimisation","Reporting & commentary time reduced","Avg time per report",75,"minutes",-16,16,120000,600,78,"Medium","Benchmark","Finance benchmark","Validate report volume"),lv("Productivity & Process Efficiency","Self-serve data queries","Avg time per ad-hoc request",25,"minutes",-8,8,90000,600,74,"Low","Assumed","Estimate","Validate query volume")]}),
    ag({id:"kb",name:"Knowledge Base Search Assistant",owner:"Enterprise IT",dept:"Information Technology",fn:"Employee Services",process:"Enterprise knowledge and intranet search",userGroup:"All employees",users:5800,risk:"Low",readiness:72,conf:"Medium",lifecycle:"Scaling",usage:"High",desc:"Provides fast, cited answers from policies and knowledge sources, reducing search time.",
      levers:[lv("Employee Experience","Knowledge & intranet search reduced","Avg time to find an answer",7,"minutes",-4,4,360000,5800,62,"Medium","Assumed","Estimate — needs telemetry","Validate query volume")]})

};

/* universal building blocks for user-created orgs */
const UNIVERSAL_PILLARS=["Operational Efficiency & Capacity","Service Experience & Outcomes","Workforce Sustainability & Capability","Risk, Governance & Compliance","Financial Value & Cost Avoidance"];
const UNIVERSAL_INTERP={"Operational Efficiency & Capacity":"Time and capacity returned across core processes.","Service Experience & Outcomes":"Faster, more consistent service to customers, citizens or patients.","Workforce Sustainability & Capability":"Lower administrative load and faster knowledge access supporting the workforce.","Risk, Governance & Compliance":"More consistent, auditable outputs reducing exposure.","Financial Value & Cost Avoidance":"Reduced rework and avoidable cost."};
const INDUSTRIES=["Public Safety / Policing","Health & Human Services","Local Government","Justice & Courts","Transport & Infrastructure","Education","Utilities","Finance","Corporate / Enterprise"];
const IND_RATE={"Public Safety / Policing":78,"Health & Human Services":92,"Local Government":68,"Justice & Courts":82,"Transport & Infrastructure":80,"Education":66,"Utilities":78,"Finance":95,"Corporate / Enterprise":72};
const HELP_CATS=[
  {k:"Summarising information",ic:"📝",pillar:"Operational Efficiency & Capacity",mins:9},
  {k:"Case management",ic:"🗂️",pillar:"Service Experience & Outcomes",mins:10},
  {k:"Customer enquiries",ic:"💬",pillar:"Service Experience & Outcomes",mins:6},
  {k:"Clinical administration",ic:"🩺",pillar:"Operational Efficiency & Capacity",mins:10},
  {k:"Knowledge retrieval",ic:"📚",pillar:"Workforce Sustainability & Capability",mins:5},
  {k:"Document drafting",ic:"📄",pillar:"Operational Efficiency & Capacity",mins:12},
  {k:"Workflow automation",ic:"⚙️",pillar:"Operational Efficiency & Capacity",mins:8}
];

/* =====================================================================
   APP STATE
   ===================================================================== */
let APP={route:"welcome",onboardStep:1,onboard:{name:"",industry:"Corporate / Enterprise",region:"",employees:5000,budget:"",maturity:1,stance:""},
  org:null,agents:[],currentAgentId:null,baseline:null,wizard:null,audience:"Board Summary",theme:"dark",assumptions:Object.assign({},DEFAULTS),

try{const s=localStorage.getItem("avcc_v2");if(s){const p=JSON.parse(s);APP=Object.assign(APP,p);}}catch(e){}
function save(){try{localStorage.setItem("avcc_v2",JSON.stringify({route:APP.route,org:APP.org,agents:APP.agents,baseline:APP.baseline,theme:APP.theme,audience:APP.audience,assumptions:APP.assumptions}));}catch(e){}}

/* =====================================================================
   FORMATTERS + HELPERS
   ===================================================================== */
function money(n){const a=Math.abs(n);if(a>=1e9)return"$"+(n/1e9).toFixed(2)+"B";if(a>=1e6)return"$"+(n/1e6).toFixed(2)+"M";if(a>=1e3)return"$"+(n/1e3).toFixed(0)+"K";return"$"+Math.round(n);}
function num(n){return Math.round(n).toLocaleString("en-AU");}
function num1(n){return(Math.round(n*10)/10).toLocaleString("en-AU");}
function pct(n){return Math.round(n)+"%";}
function today(){return new Date().toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"});}
function confCls(c){return`chip ${c==='High'?'emerald':c==='Medium'?'amber':'rose'}`;}
function riskCls(r){return r==='Low'?'emerald':r==='Medium'?'amber':'rose';}
const PC=["var(--cyan)","var(--violet)","var(--emerald)","var(--amber)","var(--azure)","var(--rose)"];

function buildOrg(){const g=APP.org,a=APP.assumptions||DEFAULTS;return{name:g.name,industry:g.industry,region:g.region||"—",currency:g.currency||"AUD",period:"FY2025–26 (indicative)",
  workingHoursPerDay:a.workingHoursPerDay,annualHoursPerFTE:a.annualHoursPerFTE,realisation:a.realisation,conservatism:a.conservatism,
  pillars:g.pillars,pillarInterp:g.pillarInterp,statement:g.statement,governance:g.governance,agents:APP.agents};}
function O(){return calcOrg(buildOrg());}
function hasData(){return APP.org&&APP.agents.length>0;}

/* =====================================================================
   RECOMMENDATION ENGINE
   ===================================================================== */
function nextAction(){
  if(!APP.org)return{label:"Set up your organisation",desc:"Two-minute guided setup to create your workspace.",cta:"Start setup",go:()=>{APP.route='onboard';APP.onboardStep=1;render();}};
  if(APP.agents.length===0)return{label:"Create your first agent",desc:"Add one agent to unlock your value baseline and portfolio.",cta:"Create agent",go:()=>startAgent()};
  const o=O();const scale=o.agents.filter(a=>a.quadrant==="Scale now");
  if(APP.agents.length<3)return{label:"Add more agents",desc:"Assess a few agents to reveal portfolio patterns and priorities.",cta:"Create agent",go:()=>startAgent()};
  if(scale.length)return{label:"Review scale candidates",desc:`${scale.length} agent${scale.length>1?'s are':' is'} ready to scale — review and prioritise.`,cta:"View portfolio",go:()=>{APP.route='agents';render();}};
  return{label:"Generate an executive summary",desc:"Turn your assessed value into a board-ready brief.",cta:"Open reports",go:()=>{APP.route='reports';render();}};
}

/* =====================================================================
   ROUTER + SHELL
   ===================================================================== */
const NAV=[["home","Home","◎"],["agents","Agents","◈"],["insights","Insights","◭"],["reports","Reports","▦"],["settings","Settings","⛭"]];
function render(){
  const root=document.getElementById("root");
  document.documentElement.dataset.theme=APP.theme;
  let html;
  if(APP.route==="welcome"||!APP.org&&APP.route!=="onboard"){html=renderWelcome();}
  else if(APP.route==="onboard"){html=renderOnboard();}
  else if(APP.route==="createAgent"){html=shell(renderCreateAgent(),true);}
  else{
    const inner={home:renderHome,agents:renderAgents,agentDetail:renderAgentDetail,insights:renderInsights,reports:renderReports,settings:renderSettings}[APP.route]||renderHome;
    html=shell(inner());
  }
  root.innerHTML=html;
  postRender();
  window.scrollTo({top:0,behavior:"smooth"});
  save();
}
function shell(inner,focus){
  const na=nextAction();
  const navHTML=NAV.map(n=>`<button class="${APP.route===n[0]||(APP.route==='agentDetail'&&n[0]==='agents')||(APP.route==='createAgent'&&n[0]==='agents')?'on':''}" onclick="goRoute('${n[0]}')"><span class="ic">${n[2]}</span>${n[1]}</button>`).join("");
  return `<div class="shell">
    <aside class="rail">
      <div class="brand"><div class="logo">◆</div><div><h1>Agent Value<br>Command Centre</h1><span>AI Value Realisation</span></div></div>
      <nav>${navHTML}</nav>
      <div class="next"><small>Recommended next</small><b>${na.label}</b><button onclick="doNext()">${na.cta} →</button></div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div class="org"><b>${APP.org?APP.org.name:'—'}</b><small>${APP.org?APP.org.industry:''} · ${APP.agents.length} agent${APP.agents.length!==1?'s':''}</small></div>
        <div class="grow"></div>
        <div class="nextchip">Next: <b>${na.label}</b><button onclick="doNext()">${na.cta}</button></div>
        <button class="btn ghost" onclick="toggleTheme()">${APP.theme==='dark'?'☾':'☀'}</button>
      </div>
      <main class="view">${inner}</main>
    </div>
  </div>`;
}
function goRoute(r){APP.route=r;render();}
function doNext(){nextAction().go();}
function toggleTheme(){APP.theme=APP.theme==='dark'?'light':'dark';render();}

/* =====================================================================

   ===================================================================== */

  const cards=[
    ["🏢","Create Organisation","Set up your workspace in ~2 minutes.","createOrg"],
    ["🔎","Assess Existing Agents","Bring agents you already run.","assessExisting"],
    ["✨","Create New Agent","Design and value a new agent.","createNew"],
    ["🧪","Explore Example Dataset","See a fully worked portfolio.","example"],
    ["📑","Generate Executive Report","Jump straight to a board brief.","report"]
  ];
  return `<div class="welcome">

function onbNext(step){

function computeBaseline(o,stance){
  const m=o.maturity||0, emp=o.employees||1000;
  const potentialFTE=emp*0.02*(0.55+m*0.13);
  const val=potentialFTE*120000;
  const band=money(val*0.7)+"–"+money(val*1.15);
  const st=stance==="have"?10:stance==="planning"?5:0;
  const clamp=x=>Math.max(20,Math.min(96,Math.round(x)));
  const opps={"Public Safety / Policing":["Documentation","Case summarisation","Enquiry response","Knowledge retrieval"],"Health & Human Services":["Clinical documentation","Referral preparation","Patient communication","Knowledge retrieval"],"Local Government":["Resident enquiries","Approvals & planning","Document drafting","Knowledge retrieval"],"Justice & Courts":["Case preparation","Documentation","Records quality","Knowledge retrieval"],"Transport & Infrastructure":["Maintenance planning","Document review","Incident response","Compliance"],"Education":["Content drafting","Enquiry response","Administration","Knowledge retrieval"],"Utilities":["Field reporting","Document review","Customer enquiries","Compliance"],"Finance":["Reporting","Reconciliation","Customer service","Compliance"],"Corporate / Enterprise":["Customer service","HR & employee queries","Reporting","Document drafting"]}[o.industry]||["Document drafting","Customer enquiries","Reporting","Knowledge retrieval"];
  return {valueBand:band,orgReadiness:clamp(42+m*15+st),govReadiness:clamp(45+m*12),workforce:clamp(38+m*14+st),opportunities:opps};
}
function createWorkspace(){
  const d=APP.onboard;

    statement:defaultStatement(d.industry),pillars:UNIVERSAL_PILLARS.slice(),pillarInterp:UNIVERSAL_INTERP,governance:defaultGovernance(d.maturity)};
  APP.baseline=computeBaseline(d,d.stance);

}

function defaultGovernance(m){const b=40+m*10;const j=(x)=>Math.max(30,Math.min(92,b+x));return [["Data readiness",j(6)],["Ownership & accountability",j(12)],["Lifecycle management",j(-2)],["Monitoring & evaluation",j(-6)],["Security controls",j(18)],["Privacy & compliance",j(10)],["Responsible AI controls",j(4)],["Operational support",j(0)],["Adoption readiness",j(2)],["Value tracking maturity",j(-12)]].map(x=>({name:x[0],score:x[1]}));}

  <div class="body"><div class="kv">
    <div class="k">Baseline metric</div><div>${l.baseName}: ${num(l.baseVal)} ${l.unit}</div>
    <div class="k">Time saved / transaction</div><div>${l.mins} minutes</div>
    <div class="k">Transactions / year</div><div>${num(l.txns)}</div>
    <div class="k">Labour rate</div><div>$${l.rate}/hr</div>
    <div class="k">Assumption type</div><div>${l.atype}</div>
    <div class="k">Source</div><div>${l.src}</div>
    <div class="k">Validation required</div><div>${l.valreq}</div>
  </div>
  <div class="formula">Hours saved        = ${num(l.txns)} × ${l.mins} ÷ 60 = ${num(l.hoursSaved)} hrs
Conservative hours = ${num(l.hoursSaved)} × ${o.realisation} × ${o.conservatism} = ${num(l.conservative)} hrs
FTE capacity       = ${num(l.conservative)} ÷ ${num(o.annualHoursPerFTE)} = ${num1(l.fte)} FTE
Final value        = (${num(l.hoursSaved)} × $${l.rate}) × ${o.realisation} × ${o.conservatism} = ${money(l.finalFin)}</div></div></div>`;

/* =====================================================================
   CREATE AGENT WIZARD (conversational, 7 steps + insight)
   ===================================================================== */
function startAgent(){APP.wizard={step:1,name:"",cat:null,groups:[],users:500,freq:6,process:""};APP.route="createAgent";render();}
function renderCreateAgent(){
  const w=APP.wizard;const total=7;
  if(w.step==="gen")return genLoader();
  if(w.step==="insight")return insightScreen();
  const bars=Array.from({length:total},(_,i)=>`<i class="${i+1<w.step?'done':i+1===w.step?'now':''}"></i>`).join("");
  let body="";
  if(w.step===1)body=`<div class="qh">What is your agent called?</div><div class="qsub">Give it a clear, human name your team will recognise.</div>
    <div class="field"><input type="text" value="${w.name||''}" placeholder="e.g. Case Summarisation Agent" oninput="APP.wizard.name=this.value" autofocus></div>
    <div class="hint">This can be changed later.</div>`;
  else if(w.step===2)body=`<div class="qh">What does this agent help with?</div><div class="qsub">Pick the closest match — it shapes how we estimate value.</div>
    <div class="tiles">${HELP_CATS.map(c=>`<div class="tile ${w.cat===c.k?'sel':''}" onclick="APP.wizard.cat='${c.k}';render()"><span class="ic">${c.ic}</span><b>${c.k}</b></div>`).join("")}</div>`;
  else if(w.step===3)body=`<div class="qh">Who uses this agent?</div><div class="qsub">Select all that apply.</div>
    <div class="checks">${USER_GROUPS.map(g=>`<span class="check ${w.groups.includes(g)?'sel':''}" onclick="toggleGroup('${g}')">${g}</span>`).join("")}</div>
    <div class="hint">This helps frame the value story for the right audience.</div>`;
  else if(w.step===4)body=`<div class="qh">How many people use it?</div><div class="qsub">A rough number is fine — you can refine later.</div>
    <div class="field"><div class="slabel"><span>Users</span><b id="uLab">${num(w.users)}</b></div><input type="range" min="10" max="10000" step="10" value="${w.users}" oninput="APP.wizard.users=+this.value;document.getElementById('uLab').textContent=(+this.value).toLocaleString('en-AU')"></div>
    <div class="hint">We use conservative assumptions from here.</div>`;
  else if(w.step===5)body=`<div class="qh">How often is it used?</div><div class="qsub">Roughly how many times per user, per working day.</div>
    <div class="field"><div class="slabel"><span>Interactions / user / day</span><b id="fLab">${w.freq}</b></div><input type="range" min="1" max="20" step="1" value="${w.freq}" oninput="APP.wizard.freq=+this.value;document.getElementById('fLab').textContent=this.value"></div>
    <div class="hint">≈ ${num((w.users)*(w.freq)*220)} interactions per year at 220 working days.</div>`;
  else if(w.step===6)body=`<div class="qh">Which business process does it support?</div><div class="qsub">One line is enough.</div>
    <div class="field"><textarea placeholder="e.g. Domestic & family violence documentation and referral" oninput="APP.wizard.process=this.value">${w.process||''}</textarea></div>`;
  else body=`<div class="qh">Ready to generate the assessment</div><div class="qsub">We'll estimate capacity and value from what you've told us.</div>
    <div class="card pad"><div class="kv">
      <div class="k">Agent</div><div><b>${w.name||'Untitled agent'}</b></div>
      <div class="k">Helps with</div><div>${w.cat||'—'}</div>
      <div class="k">Users</div><div>${num(w.users)} · ${w.groups.join(', ')||'—'}</div>
      <div class="k">Frequency</div><div>${w.freq} / user / day</div>
      <div class="k">Process</div><div>${w.process||'—'}</div>
    </div></div>`;
  const canNext=(w.step===1&&w.name)||(w.step===2&&w.cat)||(w.step===3)||(w.step>=4&&w.step<=6)||w.step===7;
  const last=w.step===7;
  return `<div class="wizard">
    <div class="wizard-top"><div class="stepno">Create agent · Step ${w.step} of ${total}</div><button class="btn ghost tiny" onclick="goRoute(APP.agents.length?'agents':'home')">Cancel</button></div>
    <div class="stepbar">${bars}</div>
    <div class="stepno">New agent</div>${body}
    <div class="wizard-nav">
      <button class="btn ghost" onclick="agentBack()" ${w.step===1?'style=visibility:hidden':''}>← Back</button>
      <button class="btn primary lg" ${canNext?'':'disabled style=opacity:.5'} onclick="${last?'agentGenerate()':'agentNext()'}">${last?'Generate assessment ✨':'Continue →'}</button>
    </div>
  </div>`;
}
function toggleGroup(g){const i=APP.wizard.groups.indexOf(g);if(i>=0)APP.wizard.groups.splice(i,1);else APP.wizard.groups.push(g);render();}
function agentNext(){const w=APP.wizard;if(w.step===1&&!w.name)return;if(w.step===2&&!w.cat)return;w.step++;render();}
function agentBack(){APP.wizard.step--;render();}
function agentGenerate(){APP.wizard.step="gen";render();
  let i=0;const steps=["Analysing your inputs…","Mapping to strategic pillars…","Estimating capacity returned…","Applying conservative assumptions…","Preparing insights…"];
  const tick=()=>{const s=document.querySelector(".loader .status");if(s&&i<steps.length){s.textContent=steps[i++];setTimeout(tick,620);}else{APP.wizard.step="insight";render();}};
  setTimeout(tick,300);
}
function genLoader(){
  return `<div class="wizard"><div class="loader">${spinner()}<h3>Generating assessment</h3><div class="status">Analysing your inputs…</div></div></div>`;
}
function insightScreen(){
  const w=APP.wizard;
  const benefits=["Capacity creation","Reduced administrative effort","Improved service delivery","Improved governance & consistency","Workforce sustainability"];
  return `<div class="wizard">
    <div class="stepno">AI insight</div><div class="qh">Here's what we're seeing</div>
    <div class="qsub">Based on your inputs, <b>${w.name}</b> is likely to deliver value through:</div>
    <div class="insight-list">${benefits.map((b,i)=>`<div class="insight-item" style="animation-delay:${i*0.08}s"><span class="tick">✓</span><div><b style="font-size:13.5px">${b}</b></div></div>`).join("")}</div>
    <div class="callout violet">Would you like us to estimate the capacity and financial value this agent could create?</div>
    <div class="wizard-nav"><button class="btn ghost" onclick="APP.wizard.step=7;render()">← Adjust inputs</button><button class="btn primary lg" onclick="commitAgent()">Generate value assessment →</button></div>
  </div>`;
}
function commitAgent(){
  const w=APP.wizard;const cat=HELP_CATS.find(c=>c.k===w.cat)||HELP_CATS[0];
  const txns=Math.round(w.users*w.freq*220);
  const rate=IND_RATE[APP.org.industry]||72;
  const m=APP.org.maturity||1;
  const id="ua"+(APP.agents.length+1)+"_"+Math.round(w.users);
  const agent={id,name:w.name||"New agent",owner:"—",dept:"—",fn:cat.k,process:w.process||cat.k,userGroup:w.groups.join(", ")||"Staff",users:w.users,
    lifecycle:APP.org.stance==="have"?"Piloting":"Exploring",type:"Assistive agent",platform:"Microsoft Copilot / Copilot Studio",usage:w.freq>=10?"High":w.freq>=5?"Growing":"Emerging",
    risk:"Medium",readiness:Math.max(35,Math.min(85,45+m*11+(APP.org.stance==="have"?6:0))),conf:"Low",governance:Math.max(35,Math.min(88,44+m*12)),
    desc:`Supports ${(w.groups.join(', ')||'staff').toLowerCase()} with ${w.cat?w.cat.toLowerCase():'their work'} for ${w.process||'a core process'}.`,
    levers:[lv(cat.pillar,`${w.cat} time reduced`,"Avg time per interaction",cat.mins*2,"minutes",-cat.mins,cat.mins,txns,w.users,rate,"Low","Assumed","Estimated from your inputs — validate with usage data","Validate volume, minutes saved and adoption")]};
  APP.agents.push(agent);APP.currentAgentId=id;APP.wizard=null;APP.route="agentDetail";render();
  setTimeout(()=>toast("Agent created — value assessed"),200);
}

function listOr(arr,fn,empty){return arr.length?arr.slice(0,5).map(x=>`<div class="soft" style="font-size:12.5px;padding:5px 0">• ${fn(x)}</div>`).join(""):`<div class="tiny" style="padding:6px 0">${empty}</div>`;}
function weakest(){const g=APP.org.governance||[];if(!g.length)return"value tracking";return g.slice().sort((a,b)=>a.score-b.score)[0].name;}

}

    <div style="display:flex;gap:10px;flex-wrap:wrap">

      <button class="btn" onclick="document.getElementById('importFile').click()">⬆ Restore from backup</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importBackup(this)">
    </div>
    <div class="hint" style="margin-top:10px">Includes your organisation, agents, assumptions and baseline — everything needed to reopen exactly where you left off.</div>
  </div>
  <div class="card pad" style="margin-top:16px"><div class="eyebrow">Workspace</div>
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
      <button class="btn" onclick="loadExample()">Load example portfolio</button>
      <button class="btn ghost" onclick="resetWorkspace()">Reset workspace</button>
    </div>
    <div class="hint" style="margin-top:10px">Reset clears your organisation and agents and returns to the welcome screen.</div>
  </div>`;
}
let SC=null;
function aRow(k,label,val,min,max,step,disp){return `<div style="margin-bottom:14px"><div class="slabel"><span>${label}</span><b id="al_${k}">${disp}</b></div><input type="range" min="${min}" max="${max}" step="${step}" value="${val}" oninput="assumpSet('${k}',this.value)"></div>`;}
function sRow(k,label,val,min,max,step,disp){return `<div style="margin-bottom:13px"><div class="slabel"><span>${label}</span><b id="sl_${k}">${disp}</b></div><input type="range" min="${min}" max="${max}" step="${step}" value="${val}" oninput="scSet('${k}',this.value)"></div>`;}
function setLab(id,t){const e=document.getElementById(id);if(e)e.textContent=t;}
function assumpSet(k,v){v=parseFloat(v);const a=APP.assumptions;
  if(k==='hpd'){a.workingHoursPerDay=v;setLab('al_hpd',v);}
  else if(k==='hfte'){a.annualHoursPerFTE=v;setLab('al_hfte',num(v));}
  else if(k==='real'){a.realisation=v/100;setLab('al_real',Math.round(v)+'%');}
  else if(k==='cons'){a.conservatism=v/100;setLab('al_cons',Math.round(v)+'%');}
  save();assumpPreview();}
function assumpPreview(){const el=document.getElementById('assumpPrev');if(!el)return;
  if(!APP.agents.length){el.innerHTML='Add agents to see live portfolio impact here.';return;}
  const o=O();el.innerHTML=`Portfolio impact → <b>${money(o.totals.finalFin)}</b> annual value · <b>${num(o.totals.conservative)}</b> hours · <b>${num1(o.totals.fte)}</b> FTE · confidence ${o.confLabel}`;}
function resetAssumptions(){APP.assumptions=Object.assign({},DEFAULTS);save();render();}
function scInitV2(){const a=APP.assumptions;SC={txns:120000,mins:10,adoption:80,real:Math.round(a.realisation*100),cons:Math.round(a.conservatism*100),ramp:75,rate:(APP.org&&IND_RATE[APP.org.industry])||72,hpd:a.workingHoursPerDay,hfte:a.annualHoursPerFTE};}
function scSet(k,v){v=parseFloat(v);SC[k]=v;const disp={txns:num(v),mins:v+' min',adoption:v+'%',real:v+'%',cons:v+'%',ramp:v+'%',rate:'$'+v}[k];setLab('sl_'+k,disp);scDrawV2();}
function scComputeV2(m){const adopt=SC.adoption/100,real=SC.real/100,cons=SC.cons/100,ramp=SC.ramp/100;const hoursSaved=SC.txns*adopt*SC.mins/60;const conservative=hoursSaved*real*cons*ramp*m;return {conservative,opsDays:conservative/SC.hpd,fte:conservative/SC.hfte,value:hoursSaved*SC.rate*real*cons*ramp*m};}
function scDrawV2(){const out=document.getElementById('scOut');if(!out||!SC)return;const exp=scComputeV2(1),lo=scComputeV2(0.75),hi=scComputeV2(1.3);
  out.innerHTML=`<div class="eyebrow">Modelled outputs (year 1)</div>
    <div class="scenario-out" style="margin-top:12px">
      <div class="o"><small>Hours returned</small><b>${num(exp.conservative)}</b></div>
      <div class="o"><small>Working days</small><b>${num(exp.opsDays)}</b></div>
      <div class="o"><small>FTE capacity</small><b>${num1(exp.fte)}</b></div>
      <div class="o"><small>Annual value</small><b>${money(exp.value)}</b></div>
    </div>
    <div class="eyebrow" style="margin-top:16px">Sensitivity range</div>
    <div class="range3">
      <div class="r"><small>Conservative</small><b>${money(lo.value)}</b><div class="tiny">${num(lo.conservative)} hrs</div></div>
      <div class="r exp"><small>Expected</small><b>${money(exp.value)}</b><div class="tiny">${num(exp.conservative)} hrs</div></div>
      <div class="r"><small>Ambitious</small><b>${money(hi.value)}</b><div class="tiny">${num(hi.conservative)} hrs</div></div>
    </div>
    <div class="callout amber" style="margin-top:14px;font-size:12px">Sandbox only. Range reflects ±adoption/realisation swings; refine with validated baselines before use in a business case.</div>`;}

function exportBackup(){
  const data={app:"Agent Value Command Centre",type:"workspace-backup",version:2,exported:today(),
    disclaimer:"Synthetic/indicative — validate before use.",
    org:APP.org,agents:APP.agents,assumptions:APP.assumptions,baseline:APP.baseline};
  download(`avcc-backup-${((APP.org&&APP.org.name)||'workspace').replace(/\W+/g,'-').toLowerCase()}-${today().replace(/\s+/g,'-')}.json`,JSON.stringify(data,null,2),"application/json");
}
function applyBackup(d){
  if(!d||!d.org||!Array.isArray(d.agents))throw new Error("that file isn't a workspace backup");
  APP.org=d.org;APP.agents=d.agents;APP.assumptions=d.assumptions||Object.assign({},DEFAULTS);APP.baseline=d.baseline||null;APP.currentAgentId=null;SC=null;return d.agents.length;
}
function importBackup(input){const f=input&&input.files&&input.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const n=applyBackup(JSON.parse(r.result));APP.route="home";save();render();toast("Workspace restored — "+n+" agents");}catch(e){toast("Import failed: "+e.message);}};
  r.onerror=()=>toast("Could not read that file");r.readAsText(f);input.value="";}
function resetWorkspace(){showModal(`<h3>Reset workspace?</h3><p class="soft" style="font-size:13px">This clears your organisation and all agents in this prototype and returns you to the welcome screen.</p><div style="margin-top:16px;display:flex;gap:10px"><button class="btn" style="border-color:var(--rose);color:var(--rose)" onclick="doReset()">Yes, reset</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);}
function doReset(){APP.org=null;APP.agents=[];APP.baseline=null;APP.route="welcome";APP.onboard={name:"",industry:"Corporate / Enterprise",region:"",employees:5000,budget:"",maturity:1,stance:""};closeModal();render();}

/* =====================================================================
   SHARED: empty state, illustration, charts, modal, export
   ===================================================================== */
function emptyState(title,body,cta,fn){window._emptyFn=fn;return `<div class="empty">${illus()}<h2>${title}</h2><p>${body}</p><div class="time">⏱ About 2 minutes</div><br><button class="btn primary lg" onclick="window._emptyFn&&window._emptyFn()">${cta} →</button></div>`;}
function illus(){return `<svg class="illus" width="140" height="120" viewBox="0 0 140 120" fill="none"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38E1FF"/><stop offset="1" stop-color="#5B6BFF"/></linearGradient></defs>
    <rect x="24" y="34" width="92" height="66" rx="12" fill="url(#g1)" opacity=".12" stroke="url(#g1)" stroke-opacity=".5"/>
    <circle cx="70" cy="40" r="16" fill="url(#g1)" opacity=".18" stroke="url(#g1)"/><path d="M70 33v14M63 40h14" stroke="url(#g1)" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="40" y="70" width="60" height="7" rx="3.5" fill="url(#g1)" opacity=".35"/><rect x="40" y="84" width="40" height="7" rx="3.5" fill="url(#g1)" opacity=".22"/></svg>`;}
function spinner(){return `<svg class="spin" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4"/><circle cx="25" cy="25" r="20" fill="none" stroke="url(#sg)" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 160"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/></circle><defs><linearGradient id="sg"><stop offset="0" stop-color="#38E1FF"/><stop offset="1" stop-color="#5B6BFF"/></linearGradient></defs></svg>`;}
function donut(segs,center,sub){const total=segs.reduce((s,x)=>s+x.value,0)||1;const R=64,C=2*Math.PI*R;let off=0;
  const arcs=segs.map(s=>{const len=s.value/total*C;const el=`<circle r="${R}" cx="90" cy="90" fill="none" stroke="${s.color}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"/>`;off+=len;return el;}).join("");
  return `<svg width="180" height="180" viewBox="0 0 180 180"><circle r="${R}" cx="90" cy="90" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="20"/>${arcs}<text x="90" y="86" text-anchor="middle" fill="var(--ink)" font-size="20" font-weight="750">${center}</text><text x="90" y="104" text-anchor="middle" fill="var(--ink-mute)" font-size="9.5" letter-spacing="1">${sub.toUpperCase()}</text></svg>`;}
function heatmap(agents){const W=760,H=380,pad=42;const x=v=>pad+v/100*(W-pad*2);const y=v=>H-pad-v/100*(H-pad*2);const maxU=Math.max(...agents.map(a=>a.users),1);
  const bub=agents.map(a=>{const r=9+Math.sqrt(a.users/maxU)*28;return `<g><circle cx="${x(a.readiness)}" cy="${y(a.valueScore)}" r="${r}" fill="${RISK_COLOR[a.risk]}22" stroke="${RISK_COLOR[a.risk]}" stroke-width="1.4"/><title>${a.name} — value ${a.valueScore}, readiness ${a.readiness}, ${a.risk} risk</title><text x="${x(a.readiness)}" y="${y(a.valueScore)+3}" text-anchor="middle" font-size="8.5" fill="var(--ink)">${a.name.split(' ')[0]}</text></g>`;}).join("");
  const mx=x(55),my=y(50);const q=(tx,ty,t,an)=>`<text x="${tx}" y="${ty}" fill="var(--ink-mute)" font-size="10.5" text-anchor="${an}" opacity=".8">${t}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:400px"><line x1="${mx}" y1="${pad}" x2="${mx}" y2="${H-pad}" stroke="rgba(255,255,255,.12)" stroke-dasharray="4 5"/><line x1="${pad}" y1="${my}" x2="${W-pad}" y2="${my}" stroke="rgba(255,255,255,.12)" stroke-dasharray="4 5"/>${q(W-pad-6,pad+14,"▲ Scale now","end")}${q(pad+6,pad+14,"Validate next","start")}${q(W-pad-6,H-pad-6,"Monitor","end")}${q(pad+6,H-pad-6,"Rework / retire","start")}<text x="${W/2}" y="${H-8}" text-anchor="middle" fill="var(--ink-mute)" font-size="10.5">Readiness →</text><text x="12" y="${H/2}" text-anchor="middle" fill="var(--ink-mute)" font-size="10.5" transform="rotate(-90 12 ${H/2})">Value potential →</text>${bub}</svg>`;}
function ring(v){const R=24,C=2*Math.PI*R,len=v/100*C,col=v>=70?'var(--emerald)':v>=50?'var(--amber)':'var(--rose)';return `<svg width="64" height="64" viewBox="0 0 64 64"><circle r="${R}" cx="32" cy="32" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="6"/><circle r="${R}" cx="32" cy="32" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${len} ${C}" transform="rotate(-90 32 32)"/><text x="32" y="36" text-anchor="middle" fill="var(--ink)" font-size="14" font-weight="700">${v}</text></svg>`;}
function trendLine(total){const W=420,H=150,pad=26;const pts=[0.18,0.34,0.52,0.7,0.86,1].map(f=>f*total);const max=total||1;const x=i=>pad+i/(pts.length-1)*(W-pad*2);const y=v=>H-pad-v/max*(H-pad*2);
  const d=pts.map((v,i)=>`${i?'L':'M'}${x(i)} ${y(v)}`).join(" ");const area=d+` L${x(pts.length-1)} ${H-pad} L${x(0)} ${H-pad} Z`;const mo=["M1","M2","M3","M4","M5","M6"];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:170px"><defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38E1FF" stop-opacity=".35"/><stop offset="1" stop-color="#38E1FF" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#tg)"/><path d="${d}" fill="none" stroke="url(#sg2)" stroke-width="2.5" stroke-linecap="round"/><defs><linearGradient id="sg2"><stop offset="0" stop-color="#38E1FF"/><stop offset="1" stop-color="#5B6BFF"/></linearGradient></defs>${pts.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#38E1FF"/><text x="${x(i)}" y="${H-8}" text-anchor="middle" fill="var(--ink-mute)" font-size="9">${mo[i]}</text>`).join("")}</svg>`;}

function kpiModal(key){const o=O(),t=o.totals;const M={
  hours:["Hours Returned",`<div class="formula">Σ (Transactions × Minutes ÷ 60) × ${o.realisation} × ${o.conservatism}</div><p class="soft">Conservative hours returned across all levers.</p>`],
  days:["Working Days Returned",`<div class="formula">Conservative hours ÷ ${o.workingHoursPerDay} = ${num(t.opsDays)} days</div>`],
  fte:["FTE Capacity Created",`<div class="formula">Conservative hours ÷ ${num(o.annualHoursPerFTE)} = ${num1(t.fte)} FTE</div><p class="soft">Capacity created for higher-value work — not a headcount reduction target.</p>`],
  value:["Estimated Annual Value",`<div class="formula">Σ (Hours saved × Labour rate) × ${o.realisation} × ${o.conservatism} = ${money(t.finalFin)}</div>`]};
  const m=M[key];showModal(`<h3>${m[0]}</h3><div class="tiny">Calculation detail</div>${m[1]}`);}
function driverModal(i){const o=O(),d=o.drivers[i];showModal(`<h3>${d.driver}</h3><div class="tiny">${d.agent} · ${d.pillar}</div><div class="kv" style="margin-top:12px"><div class="k">Time saved</div><div>${d.mins} min × ${num(d.txns)} txns</div><div class="k">Raw hours saved</div><div>${num(d.hoursSaved)}</div><div class="k">Conservative hours</div><div>${num(d.conservative)} · ${num1(d.fte)} FTE</div><div class="k">Final value</div><div><b>${money(d.finalFin)}</b></div><div class="k">Confidence</div><div><span class="${confCls(d.conf)}">${d.conf}</span></div><div class="k">Source</div><div>${d.src}</div><div class="k">Validate</div><div>${d.valreq}</div></div><div class="callout" style="margin-top:12px"><b>Why it matters:</b> contributes to <b>${d.pillar}</b> by returning time and improving consistency.</div>`);}
function showModal(h){const m=document.getElementById("modal");m.innerHTML=`<button class="close" onclick="closeModal()">×</button>${h}`;document.getElementById("overlay").classList.add("on");}
function closeModal(){document.getElementById("overlay").classList.remove("on");}

function exportJSON(){const o=O();const model={generated:today(),disclaimer:"Synthetic demo data — indicative estimates only.",organisation:{name:o.name,industry:o.industry,region:o.region,currency:o.currency},totals:{hoursReturned:Math.round(o.totals.conservative),fte:Math.round(o.totals.fte*10)/10,annualValue:Math.round(o.totals.finalFin),users:o.totals.users},confidence:o.confLabel,pillars:o.pillars.map(p=>({name:p.name,value:Math.round(p.value),pct:Math.round(p.pct)})),agents:o.agents.map(a=>({name:a.name,process:a.process,users:a.users,readiness:a.readiness,confidence:a.conf,annualValue:Math.round(a.finalFin),priority:a.recommendation.tag}))};download(`agent-value-${(APP.org.name||'org').replace(/\W+/g,'-').toLowerCase()}.json`,JSON.stringify(model,null,2),"application/json");}
function download(name,content,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);toast("Downloaded "+name);}
function copy(txt){navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>toast("Copied to clipboard")).catch(()=>toast("Copy failed"));}
function toast(msg){let e=document.getElementById("toast");if(!e){e=document.createElement("div");e.id="toast";e.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--glass-2);border:1px solid var(--glass-brd-strong);backdrop-filter:blur(14px);padding:12px 20px;border-radius:14px;z-index:99;font-size:13px;box-shadow:var(--shadow);transition:.3s";document.body.appendChild(e);}e.textContent=msg;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,2200);}

/* post-render: count-up animation */
function postRender(){
  document.querySelectorAll('.kpi .val[data-count]').forEach(el=>{
    const target=parseFloat(el.dataset.count);if(isNaN(target)||target===0)return;const raw=el.dataset.raw;const isMoney=/[$KMB]/.test(raw);const dec=raw.indexOf('.')>-1?1:0;let t0=null;
    function step(ts){if(!t0)t0=ts;const p=Math.min((ts-t0)/850,1);const e=1-Math.pow(1-p,3);const v=target*e;
      if(isMoney){const s=raw.replace(/[0-9.,]/g,'');el.textContent=(s.includes('$')?'$':'')+v.toFixed(dec)+s.replace('$','');}
      else el.textContent=dec?num1(v):num(Math.round(v));
      if(p<1)requestAnimationFrame(step);else el.textContent=raw;}
    requestAnimationFrame(step);
  });
  if(APP.route==='settings'){try{assumpPreview();scDrawV2();}catch(e){}}
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
render();
</script>
